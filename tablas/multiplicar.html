<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>

<body>

    <main class="contenedor-principal">

        <section class="panel">

            <div class="encabezado">
                <p class="etiqueta">SISTEMA DE APRENDIZAJE</p>
                <h1>Tabla de Multiplicar</h1>
                <p>Practica de forma rápida y sencilla</p>
            </div>
            <div class="entrada">
                <input type="number" id="txtNumero" placeholder="Ingresa un número">
            </div>
            <button class="btn-probar" onclick="generarTablas()">PROBAR</button>
            <!-- CONTENEDOR -->
            <div class="tabla" id="tablaMultiplicar">
                <div class="fila">
                    <span>3 × 1</span>
                    <strong>3</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 2</span>
                    <strong>6</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 3</span>
                    <strong>9</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 4</span>
                    <strong>12</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 5</span>
                    <strong>15</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 6</span>
                    <strong>18</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 7</span>
                    <strong>21</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 8</span>
                    <strong>24</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 9</span>
                    <strong>27</strong>
                </div>
                <!-- ITEM -->
                <div class="fila">
                    <span>3 × 10</span>
                    <strong>30</strong>
                </div>
            </div>

        </section>

    </main>

    <footer>
        Creado por Freddy Campuzano
    </footer>

    <script src="multiplicar.js"></script>

</body>

</html>
